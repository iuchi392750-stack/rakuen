name: Compose comparison video

on:
  push:
    paths:
      - "parkour/reference/compose_request.json"

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: Read request
        id: req
        run: |
          REQ=parkour/reference/compose_request.json
          echo "top_url=$(jq -r .top_url $REQ)" >> "$GITHUB_OUTPUT"
          echo "bottom_url=$(jq -r .bottom_url $REQ)" >> "$GITHUB_OUTPUT"
          echo "out_path=$(jq -r .out_path $REQ)" >> "$GITHUB_OUTPUT"

      - name: Download videos
        run: |
          curl -sSL -o top.mp4 "${{ steps.req.outputs.top_url }}"
          curl -sSL -o bottom.mp4 "${{ steps.req.outputs.bottom_url }}"
          ls -lh top.mp4 bottom.mp4

      - name: Compose stacked comparison
        run: |
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          # 下段(生成動画)が短い場合は最終フレームを引き伸ばして上段の尺に合わせる
          ffmpeg -y -i top.mp4 -i bottom.mp4 -filter_complex "\
            [0:v]scale=1280:720,drawtext=text='Blender Reference':fontfile=$FONT:fontsize=42:fontcolor=white:x=36:y=32:box=1:boxcolor=black@0.35:boxborderw=14[top];\
            [1:v]scale=1280:720,tpad=stop_mode=clone:stop_duration=10,drawtext=text='Seedance 2.0':fontfile=$FONT:fontsize=42:fontcolor=white:x=36:y=32:box=1:boxcolor=black@0.35:boxborderw=14[bot];\
            [top][bot]vstack=inputs=2:shortest=1[v]" \
            -map "[v]" -map "1:a?" -c:v libx264 -crf 20 -pix_fmt yuv420p -c:a aac \
            "${{ steps.req.outputs.out_path }}"

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "${{ steps.req.outputs.out_path }}"
          git commit -m "Add composed comparison video"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
