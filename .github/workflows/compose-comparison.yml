name: Compose comparison video

on:
  workflow_dispatch:
    inputs:
      top_url:
        description: "URL of the top video (Blender reference)"
        required: true
      bottom_url:
        description: "URL of the bottom video (Seedance result)"
        required: true
      out_path:
        description: "Output path in the repo"
        required: true
        default: "parkour/reference/comparison.mp4"

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download videos
        run: |
          curl -sSL -o top.mp4 "${{ github.event.inputs.top_url }}"
          curl -sSL -o bottom.mp4 "${{ github.event.inputs.bottom_url }}"
          ls -lh top.mp4 bottom.mp4

      - name: Compose stacked comparison
        run: |
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          ffmpeg -y -i top.mp4 -i bottom.mp4 -filter_complex "\
            [0:v]scale=1280:720,drawtext=text='Blender Reference':fontfile=$FONT:fontsize=42:fontcolor=white:x=36:y=32:box=1:boxcolor=black@0.35:boxborderw=14[top];\
            [1:v]scale=1280:720,drawtext=text='Seedance 2.0':fontfile=$FONT:fontsize=42:fontcolor=white:x=36:y=32:box=1:boxcolor=black@0.35:boxborderw=14[bot];\
            [top][bot]vstack=inputs=2[v]" \
            -map "[v]" -map "1:a?" -c:v libx264 -crf 20 -pix_fmt yuv420p -c:a aac -shortest \
            "${{ github.event.inputs.out_path }}"

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "${{ github.event.inputs.out_path }}"
          git commit -m "Add composed comparison video"
          git push
