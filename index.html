<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>楽園カレンダー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <button class="nav-btn" id="prev-btn" aria-label="前の月">&#8249;</button>
      <h1 class="month-title" id="month-title"></h1>
      <button class="nav-btn" id="next-btn" aria-label="次の月">&#8250;</button>
    </header>

    <div class="weekdays">
      <span>日</span>
      <span>月</span>
      <span>火</span>
      <span>水</span>
      <span>木</span>
      <span>金</span>
      <span>土</span>
    </div>

    <div class="calendar-grid" id="calendar-grid"></div>

    <footer class="footer">
      <button class="today-btn" id="today-btn">今日</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
