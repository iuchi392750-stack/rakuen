<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星々の彼方へ — 60秒の宇宙の旅</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  }
  #space { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  #replay {
    position: fixed;
    left: 50%;
    top: 62%;
    transform: translateX(-50%);
    padding: 10px 36px;
    font-size: 16px;
    letter-spacing: .3em;
    color: #cfe3ff;
    background: transparent;
    border: 1px solid rgba(180, 210, 255, .5);
    border-radius: 999px;
    cursor: pointer;
    display: none;
    font-family: inherit;
  }
  #replay:hover { background: rgba(120, 170, 255, .15); }
  #hint {
    position: fixed;
    right: 14px;
    bottom: 10px;
    color: rgba(200, 220, 255, .35);
    font-size: 11px;
    letter-spacing: .15em;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="space"></canvas>
<button id="replay">もういちど旅する</button>
<div id="hint">クリック / スペース で一時停止</div>
<script>
'use strict';

const DUR = 60; // 上映時間（秒）

const cv = document.getElementById('space');
const ctx = cv.getContext('2d');
const replayBtn = document.getElementById('replay');

let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = W * dpr;
  cv.height = H * dpr;
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- ユーティリティ ----------
let seed = 20250708;
function rnd() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
const clamp01 = x => Math.max(0, Math.min(1, x));
const lerp = (a, b, p) => a + (b - a) * p;
const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
// start〜end の間だけ 0→1→0 とフェードする窓関数
function fadeWindow(t, start, end, f = 0.6) {
  if (t < start || t > end) return 0;
  return Math.min(1, (t - start) / f, (end - t) / f);
}

// ---------- 星空（3層パララックス） ----------
const layers = [
  { z: 0.25, size: 0.8, stars: [] },
  { z: 0.55, size: 1.3, stars: [] },
  { z: 1.0,  size: 2.0, stars: [] },
];
for (const L of layers) {
  const n = Math.round(90 * (0.6 + L.z));
  for (let i = 0; i < n; i++) {
    L.stars.push({ nx: rnd(), ny: rnd(), tw: rnd() * Math.PI * 2, hue: rnd() });
  }
  L.off = 0;
}

// 船の体感速度（星の流れる速さ、px/s）
function shipSpeed(t) {
  let v;
  if (t < 2) {
    v = 10 + t * 35; // 発進
  } else {
    const k = smooth((t - 2) / 50);
    v = 80 + 1500 * k * k;
  }
  // ボイジャー併走シーンはややスローに
  const dip = Math.max(0, 1 - Math.pow((t - 49.5) / 3.5, 2));
  v *= 1 - 0.45 * dip;
  if (t > 54) v += (t - 54) * 900; // ラストの加速
  return v;
}

// ---------- 字幕 ----------
const captions = [
  [0.5, 5.0,  '地球 — 旅立ちの時'],
  [5.5, 8.5,  '月に別れを告げて'],
  [9.0, 13.5, '火星 — 赤い荒野を横目に'],
  [14.0, 19.0, '小惑星帯を駆け抜ける'],
  [20.0, 26.5, '木星 — 巨人の嵐'],
  [27.0, 33.5, '土星 — 氷の環'],
  [35.0, 42.0, '天王星 — 横倒しの氷の巨人を、超えて'],
  [43.0, 46.0, '前方に、小さな光……'],
  [46.5, 53.0, 'ボイジャー — 1977年から旅する先駆者を、追い抜く'],
  [54.0, 59.5, 'そして誰も見たことのない、星々の彼方へ'],
];

// 太陽からの距離（AU）の目安
const auKeys = [[0,1.0],[9.5,1.1],[11.5,1.52],[17,2.7],[23,5.2],[30,9.6],[38.5,19.2],[44,30.1],[50,167],[60,320]];
function auAt(t) {
  for (let i = 0; i < auKeys.length - 1; i++) {
    const [t0, a0] = auKeys[i], [t1, a1] = auKeys[i + 1];
    if (t <= t1) return lerp(a0, a1, smooth((t - t0) / (t1 - t0)));
  }
  return auKeys[auKeys.length - 1][1];
}

// ---------- 小惑星帯 ----------
const asteroids = [];
for (let i = 0; i < 26; i++) {
  const verts = [];
  const nv = 7 + Math.floor(rnd() * 4);
  for (let k = 0; k < nv; k++) verts.push(0.7 + rnd() * 0.5);
  asteroids.push({
    tc: 14 + rnd() * 5.5,
    span: 2.2 + rnd() * 1.6,
    y: rnd(),
    r: 2 + rnd() * 11,
    rot: rnd() * Math.PI * 2,
    spin: (rnd() - 0.5) * 1.5,
    verts,
  });
}

// ---------- 描画：天体 ----------
function drawGlow(x, y, r, color, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha;
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function clipCircle(x, y, r) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.clip();
}

function shade(x, y, r, strength) {
  // 左側（太陽側）が明るく、右側が暗い陰影
  const g = ctx.createRadialGradient(x - r * 0.45, y - r * 0.35, r * 0.1, x, y, r * 1.05);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(0.65, 'rgba(0,0,10,0)');
  g.addColorStop(1, `rgba(0,0,12,${strength})`);
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawEarth(x, y, r) {
  drawGlow(x, y, r * 1.25, 'rgba(110,180,255,0.55)', 0.8);
  clipCircle(x, y, r);
  const oc = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  oc.addColorStop(0, '#2f6fce');
  oc.addColorStop(1, '#123a86');
  ctx.fillStyle = oc;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  // 大陸
  ctx.fillStyle = '#3f9e5f';
  const blobs = [[-0.35, -0.4, 0.38], [0.25, -0.05, 0.3], [-0.1, 0.42, 0.26], [0.5, 0.4, 0.2]];
  for (const [bx, by, br] of blobs) {
    ctx.beginPath();
    ctx.ellipse(x + bx * r, y + by * r, br * r, br * r * 0.7, bx * 2, 0, Math.PI * 2);
    ctx.fill();
  }
  // 雲
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  const clouds = [[-0.5, 0.1, 0.45, 0.12], [0.1, -0.5, 0.5, 0.1], [0.3, 0.55, 0.35, 0.09], [-0.15, -0.15, 0.3, 0.08]];
  for (const [bx, by, bw, bh] of clouds) {
    ctx.beginPath();
    ctx.ellipse(x + bx * r, y + by * r, bw * r, bh * r, 0.2, 0, Math.PI * 2);
    ctx.fill();
  }
  shade(x, y, r, 0.75);
  ctx.restore();
}

function drawMoon(x, y, r) {
  clipCircle(x, y, r);
  ctx.fillStyle = '#b9b6ae';
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.fillStyle = 'rgba(90,88,84,0.6)';
  const cr = [[-0.3, -0.2, 0.18], [0.25, 0.1, 0.13], [-0.05, 0.45, 0.1], [0.45, -0.4, 0.09], [-0.55, 0.2, 0.08]];
  for (const [bx, by, br] of cr) {
    ctx.beginPath();
    ctx.arc(x + bx * r, y + by * r, br * r, 0, Math.PI * 2);
    ctx.fill();
  }
  shade(x, y, r, 0.85);
  ctx.restore();
}

function drawMars(x, y, r) {
  drawGlow(x, y, r * 1.15, 'rgba(230,120,70,0.35)', 0.7);
  clipCircle(x, y, r);
  const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  g.addColorStop(0, '#d97a4a');
  g.addColorStop(1, '#8f3c22');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.fillStyle = 'rgba(110,45,25,0.55)';
  const dk = [[-0.2, 0.15, 0.4, 0.18], [0.35, -0.25, 0.3, 0.14], [-0.5, -0.35, 0.25, 0.12]];
  for (const [bx, by, bw, bh] of dk) {
    ctx.beginPath();
    ctx.ellipse(x + bx * r, y + by * r, bw * r, bh * r, -0.25, 0, Math.PI * 2);
    ctx.fill();
  }
  // 極冠
  ctx.fillStyle = 'rgba(255,250,245,0.85)';
  ctx.beginPath();
  ctx.ellipse(x, y - r * 0.88, r * 0.35, r * 0.14, 0, 0, Math.PI * 2);
  ctx.fill();
  shade(x, y, r, 0.8);
  ctx.restore();
}

function drawJupiter(x, y, r) {
  drawGlow(x, y, r * 1.12, 'rgba(235,200,150,0.3)', 0.7);
  clipCircle(x, y, r);
  const bands = ['#e8d5b5', '#c9a36f', '#e3cba8', '#b58a55', '#ead8ba', '#c39a63', '#dfc79f', '#a97f4e', '#e6d3b2'];
  const bh = (r * 2) / bands.length;
  for (let i = 0; i < bands.length; i++) {
    ctx.fillStyle = bands[i];
    ctx.fillRect(x - r, y - r + i * bh, r * 2, bh + 1);
  }
  // 大赤斑
  ctx.fillStyle = '#c4553a';
  ctx.beginPath();
  ctx.ellipse(x + r * 0.3, y + r * 0.35, r * 0.22, r * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,220,200,0.4)';
  ctx.beginPath();
  ctx.ellipse(x + r * 0.3, y + r * 0.35, r * 0.13, r * 0.06, 0, 0, Math.PI * 2);
  ctx.fill();
  shade(x, y, r, 0.8);
  ctx.restore();
}

function drawRings(x, y, r, rx, ry, rot, color, width, front) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  if (front) ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI);      // 手前半分
  else ctx.ellipse(0, 0, rx, ry, 0, Math.PI, Math.PI * 2);  // 奥半分
  ctx.stroke();
  ctx.restore();
}

function drawSaturn(x, y, r) {
  const rot = -0.28;
  drawRings(x, y, r, r * 1.9, r * 0.52, rot, 'rgba(216,196,150,0.7)', r * 0.22, false);
  drawRings(x, y, r, r * 1.55, r * 0.42, rot, 'rgba(180,158,116,0.5)', r * 0.1, false);
  clipCircle(x, y, r);
  const g = ctx.createLinearGradient(x, y - r, x, y + r);
  g.addColorStop(0, '#efe0b8');
  g.addColorStop(0.5, '#d9bd85');
  g.addColorStop(1, '#c2a163');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.fillStyle = 'rgba(170,140,90,0.35)';
  for (let i = -3; i <= 3; i++) {
    ctx.fillRect(x - r, y + i * r * 0.24, r * 2, r * 0.06);
  }
  shade(x, y, r, 0.78);
  ctx.restore();
  drawRings(x, y, r, r * 1.9, r * 0.52, rot, 'rgba(228,210,166,0.85)', r * 0.22, true);
  drawRings(x, y, r, r * 1.55, r * 0.42, rot, 'rgba(196,174,130,0.6)', r * 0.1, true);
}

function drawUranus(x, y, r) {
  drawGlow(x, y, r * 1.3, 'rgba(140,225,235,0.4)', 0.8);
  // 横倒しのほぼ垂直な環（奥半分）
  drawRings(x, y, r, r * 1.7, r * 0.28, 1.45, 'rgba(190,235,240,0.35)', r * 0.07, false);
  clipCircle(x, y, r);
  const g = ctx.createLinearGradient(x - r, y, x + r, y);
  g.addColorStop(0, '#bdf0f2');
  g.addColorStop(0.5, '#7fd3dc');
  g.addColorStop(1, '#4fa8bd');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.3, y - r * 0.3, r * 0.6, r * 0.4, 0.4, 0, Math.PI * 2);
  ctx.fill();
  shade(x, y, r, 0.72);
  ctx.restore();
  drawRings(x, y, r, r * 1.7, r * 0.28, 1.45, 'rgba(210,245,250,0.5)', r * 0.07, true);
}

function drawNeptune(x, y, r) {
  drawGlow(x, y, r * 1.2, 'rgba(90,130,255,0.35)', 0.7);
  clipCircle(x, y, r);
  const g = ctx.createLinearGradient(x - r, y, x + r, y);
  g.addColorStop(0, '#5b7fe8');
  g.addColorStop(1, '#2b46a8');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  shade(x, y, r, 0.75);
  ctx.restore();
}

// ---------- 宇宙船（右向き） ----------
function drawShip(x, y, s, flame, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);

  // エンジン炎
  if (flame > 0.02) {
    const fl = 46 * flame * (0.85 + 0.15 * Math.sin(t * 40));
    const fg = ctx.createLinearGradient(-30, 0, -30 - fl, 0);
    fg.addColorStop(0, 'rgba(180,220,255,0.95)');
    fg.addColorStop(0.35, 'rgba(90,150,255,0.75)');
    fg.addColorStop(1, 'rgba(90,150,255,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(-28, -6);
    ctx.quadraticCurveTo(-30 - fl, 0, -28, 6);
    ctx.closePath();
    ctx.fill();
    drawGlow(-32, 0, 16 * flame, 'rgba(150,200,255,0.9)', 0.9);
  }

  // 船体
  const bg = ctx.createLinearGradient(0, -12, 0, 12);
  bg.addColorStop(0, '#f2f6ff');
  bg.addColorStop(0.55, '#aebdd6');
  bg.addColorStop(1, '#5c6b85');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(42, 0);
  ctx.quadraticCurveTo(20, -11, -14, -9);
  ctx.quadraticCurveTo(-30, -7, -30, 0);
  ctx.quadraticCurveTo(-30, 7, -14, 9);
  ctx.quadraticCurveTo(20, 11, 42, 0);
  ctx.closePath();
  ctx.fill();

  // 尾翼
  ctx.fillStyle = '#7688a6';
  ctx.beginPath();
  ctx.moveTo(-10, -8); ctx.lineTo(-26, -20); ctx.lineTo(-28, -6); ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, 8); ctx.lineTo(-26, 20); ctx.lineTo(-28, 6); ctx.closePath();
  ctx.fill();

  // コックピット窓
  ctx.fillStyle = '#173a63';
  ctx.beginPath();
  ctx.ellipse(20, -2.4, 8.5, 4.4, -0.08, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(160,215,255,0.85)';
  ctx.beginPath();
  ctx.ellipse(22, -3.4, 4.5, 1.9, -0.08, 0, Math.PI * 2);
  ctx.fill();

  // アクセントライン
  ctx.strokeStyle = 'rgba(40,60,90,0.5)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-24, 3.5);
  ctx.quadraticCurveTo(10, 7, 34, 2);
  ctx.stroke();

  ctx.restore();
}

// ---------- ボイジャー探査機 ----------
function drawVoyager(x, y, s, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.rotate(0.06 * Math.sin(t * 0.4));

  ctx.strokeStyle = '#9aa4b5';
  ctx.lineWidth = 1.6;
  // マグネトメータ・ブーム（後方に長く）
  ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(112, -14); ctx.stroke();
  ctx.beginPath(); ctx.arc(112, -14, 2.4, 0, Math.PI * 2); ctx.stroke();
  // RTGブーム
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(34, 40); ctx.stroke();
  ctx.fillStyle = '#6a7382';
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.translate(22 + i * 7, 26 + i * 8.2);
    ctx.rotate(0.87);
    ctx.fillRect(-3, -5, 6, 10);
    ctx.restore();
  }
  // 科学機器ブーム
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(-30, -44); ctx.stroke();
  ctx.fillStyle = '#8892a3';
  ctx.fillRect(-36, -52, 12, 9);

  // バス（十角形の本体）
  ctx.fillStyle = '#7d8698';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    const px = Math.cos(a) * 13, py = Math.sin(a) * 13;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fill();

  // ゴールデンレコード
  ctx.fillStyle = '#d8b23c';
  ctx.beginPath(); ctx.arc(-4, -9, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(120,90,20,0.7)';
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.arc(-4, -9, 3.4, 0, Math.PI * 2); ctx.stroke();

  // ハイゲイン・アンテナ（地球＝左向き）
  const dg = ctx.createLinearGradient(-40, -30, -10, 30);
  dg.addColorStop(0, '#f4f6fa');
  dg.addColorStop(1, '#b8c0cd');
  ctx.fillStyle = dg;
  ctx.beginPath();
  ctx.ellipse(-16, 0, 12, 30, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,100,115,0.8)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(-16, 0, 12, 30, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(-16, 0, 5, 13, 0, 0, Math.PI * 2);
  ctx.stroke();
  // フィード
  ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(-30, 0); ctx.lineTo(-16, 8); ctx.stroke();
  ctx.fillStyle = '#67707f';
  ctx.beginPath(); ctx.arc(-30, 0, 2.6, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// ---------- 惑星の通過スケジュール ----------
// y, r は画面高さに対する割合
const passes = [
  { tIn: 5.5,  tOut: 8.5,  y: 0.28, r: 0.055, draw: drawMoon },
  { tIn: 9.0,  tOut: 13.5, y: 0.42, r: 0.13,  draw: drawMars },
  { tIn: 19.5, tOut: 26.5, y: 0.38, r: 0.42,  draw: drawJupiter },
  { tIn: 27.0, tOut: 34.0, y: 0.40, r: 0.30,  draw: drawSaturn },
  { tIn: 35.0, tOut: 42.0, y: 0.36, r: 0.27,  draw: drawUranus },
  { tIn: 42.0, tOut: 45.5, y: 0.22, r: 0.06,  draw: drawNeptune }, // 彼方に小さく
];

// ---------- メインループ ----------
const params = new URLSearchParams(location.search);
const seekTo = parseFloat(params.get('t')) || 0;

let startTime = null;
let paused = false;
let pausedAt = 0;
let finished = false;
let lastNow = null;

function currentT(now) {
  if (startTime === null) startTime = now - seekTo * 1000;
  return (now - startTime) / 1000;
}

function togglePause() {
  if (finished) return;
  const now = performance.now();
  if (!paused) {
    paused = true;
    pausedAt = now;
  } else {
    paused = false;
    startTime += now - pausedAt;
  }
}
cv.addEventListener('click', togglePause);
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
});
replayBtn.addEventListener('click', () => {
  finished = false;
  paused = false;
  startTime = performance.now();
  replayBtn.style.display = 'none';
});

function frame(now) {
  requestAnimationFrame(frame);
  if (lastNow === null) lastNow = now;
  const dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;

  let t = paused ? (pausedAt - startTime) / 1000 : currentT(now);
  if (t >= DUR) {
    t = DUR;
    if (!finished) {
      finished = true;
      replayBtn.style.display = 'block';
    }
  }

  // ----- 背景 -----
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#03050f');
  bg.addColorStop(0.6, '#050a1c');
  bg.addColorStop(1, '#02040c');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 天の川（うっすら）
  drawGlow(W * 0.7, H * 0.25, H * 0.9, 'rgba(120,130,190,0.10)', 1);
  drawGlow(W * 0.35, H * 0.65, H * 0.7, 'rgba(150,120,180,0.06)', 1);

  // 遠ざかる太陽（左後方）
  const sunFade = clamp01(1 - (t - 6) / 34);
  if (t > 4 && sunFade > 0) {
    const sr = lerp(26, 5, smooth((t - 4) / 36));
    drawGlow(W * 0.06, H * 0.7, sr * 6, `rgba(255,225,160,${0.5 * sunFade})`, 1);
    ctx.fillStyle = `rgba(255,240,200,${0.95 * sunFade})`;
    ctx.beginPath();
    ctx.arc(W * 0.06, H * 0.7, sr, 0, Math.PI * 2);
    ctx.fill();
  }

  // ----- 星（パララックス＋加速で流星化） -----
  const v = shipSpeed(t);
  for (const L of layers) {
    if (!paused && !finished) L.off += v * L.z * dt;
    const streak = Math.min(40, v * L.z * 0.018);
    for (const st of L.stars) {
      const x = ((st.nx * W - L.off) % W + W) % W;
      const y = st.ny * H;
      const tw = 0.55 + 0.45 * Math.sin(now / 700 + st.tw);
      const c = st.hue < 0.15 ? '190,205,255' : st.hue > 0.9 ? '255,225,200' : '235,240,255';
      ctx.strokeStyle = `rgba(${c},${(0.35 + 0.55 * L.z) * tw})`;
      ctx.lineWidth = L.size;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.max(0.6, streak), y);
      ctx.stroke();
    }
  }

  // ----- 惑星の通過 -----
  for (const p of passes) {
    if (t < p.tIn - 0.2 || t > p.tOut + 0.2) continue;
    const prog = smooth((t - p.tIn) / (p.tOut - p.tIn));
    const r = p.r * H;
    const x = lerp(W + r * 2.2, -r * 2.2, prog);
    p.draw(x, p.y * H, r);
  }

  // ----- 小惑星帯 -----
  if (t > 13 && t < 21) {
    for (const a of asteroids) {
      const p = (t - (a.tc - a.span / 2)) / a.span;
      if (p < 0 || p > 1) continue;
      const x = lerp(W + 30, -30, p);
      const y = a.y * H;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a.rot + t * a.spin);
      ctx.fillStyle = '#8d8779';
      ctx.beginPath();
      const nv = a.verts.length;
      for (let i = 0; i < nv; i++) {
        const ang = (i / nv) * Math.PI * 2;
        const rr = a.r * a.verts[i];
        i ? ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr) : ctx.moveTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.arc(a.r * 0.3, a.r * 0.2, a.r * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ----- 地球（出発） -----
  if (t < 9) {
    const dep = smooth((t - 0.8) / 6.5); // 0→1 で遠ざかる
    const er = lerp(H * 0.62, 7, dep);
    const ex = lerp(W * 0.26, -W * 0.06, dep);
    const ey = lerp(H * 1.02, H * 0.86, dep);
    ctx.globalAlpha = clamp01((9 - t) / 1.2);
    drawEarth(ex, ey, er);
    ctx.globalAlpha = 1;
  }

  // ----- ボイジャー（追い抜き） -----
  const V_IN = 44, V_OUT = 55;
  if (t > V_IN && t < V_OUT) {
    const p = smooth((t - V_IN) / (V_OUT - V_IN));
    const vx = lerp(W + 140, -220, p);
    const vy = H * 0.40 + Math.sin(t * 0.5) * 8;
    const vs = lerp(0.35, 1.25, smooth(p * 1.6));
    drawVoyager(vx, vy, vs, t);
    // ラベル
    const la = fadeWindow(t, 46.5, 53, 0.8);
    if (la > 0 && vx > -100 && vx < W) {
      ctx.globalAlpha = la * 0.9;
      ctx.fillStyle = '#ffe9a8';
      ctx.font = `${Math.max(11, H * 0.017)}px "Hiragino Mincho ProN","Yu Mincho",serif`;
      ctx.textAlign = 'center';
      ctx.fillText('VOYAGER 1  ·  1977', vx, vy - H * 0.11);
      ctx.strokeStyle = 'rgba(255,233,168,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(vx, vy - H * 0.1);
      ctx.lineTo(vx, vy - H * 0.055);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ----- 宇宙船 -----
  {
    // 発進：地球の縁 → 巡航位置
    const dep = smooth((t - 0.8) / 6.5);
    const er = lerp(H * 0.62, 7, dep);
    const ex = lerp(W * 0.26, -W * 0.06, dep);
    const ey = lerp(H * 1.02, H * 0.86, dep);
    const launchP = smooth((t - 0.6) / 4.2);
    const sx0 = ex + er * 0.55, sy0 = ey - er * 0.98;
    let sx = lerp(sx0, W * 0.30, launchP);
    let sy = lerp(sy0, H * 0.52, launchP) + Math.sin(t * 1.3) * 6 * launchP;
    // ボイジャー追い抜き：少し前へ出る
    const boost = smooth((t - 50) / 4) * (1 - smooth((t - 57) / 3) * 0.3);
    sx += boost * W * 0.16;
    // ラスト：さらに前方へ
    sx += smooth((t - 56) / 4) * W * 0.1;

    const flame = t < 5 ? 1 : 0.45 + 0.4 * boost + (t > 54 ? 0.5 : 0);
    const scale = Math.max(0.8, H / 720);
    drawShip(sx, sy, scale, Math.min(1.4, flame), t);
  }

  // ----- ビネット -----
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // ----- タイトル -----
  {
    const a = fadeWindow(t, 0.3, 5.5, 1.0);
    if (a > 0) {
      ctx.globalAlpha = a;
      ctx.fillStyle = '#e8f0ff';
      ctx.textAlign = 'center';
      ctx.font = `${Math.max(22, H * 0.048)}px "Hiragino Mincho ProN","Yu Mincho",serif`;
      ctx.fillText('星 々 の 彼 方 へ', W / 2, H * 0.18);
      ctx.font = `${Math.max(11, H * 0.017)}px "Hiragino Mincho ProN","Yu Mincho",serif`;
      ctx.fillStyle = 'rgba(200,215,245,0.8)';
      ctx.fillText('— A 60-SECOND VOYAGE —', W / 2, H * 0.225);
      ctx.globalAlpha = 1;
    }
  }

  // ----- 字幕 -----
  for (const [s, e, text] of captions) {
    const a = fadeWindow(t, s, e);
    if (a <= 0) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dce8ff';
    ctx.textAlign = 'center';
    ctx.font = `${Math.max(15, H * 0.026)}px "Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 8;
    ctx.fillText(text, W / 2, H * 0.86);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // ----- HUD（距離・時間・進行バー） -----
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(170,200,255,0.75)';
  ctx.font = `${Math.max(11, H * 0.016)}px "Courier New",monospace`;
  const au = auAt(t);
  ctx.fillText(`SOL DIST  ${au >= 10 ? au.toFixed(1) : au.toFixed(2)} AU`, W - 18, 30);
  const mm = Math.floor(t / 60), ss = Math.floor(t % 60);
  ctx.fillText(`T+ ${mm}:${String(ss).padStart(2, '0')} / 1:00`, W - 18, 50);

  // 進行バー
  const bx = W * 0.08, bw = W * 0.84, by = H - 22;
  ctx.strokeStyle = 'rgba(150,180,230,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bw, by); ctx.stroke();
  ctx.strokeStyle = 'rgba(180,210,255,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bw * (t / DUR), by); ctx.stroke();
  // マーカー
  const marks = [[0, '地球'], [11, '火星'], [23, '木星'], [30, '土星'], [38.5, '天王星'], [49.5, 'ボイジャー']];
  ctx.textAlign = 'center';
  ctx.font = `${Math.max(9, H * 0.013)}px "Hiragino Mincho ProN","Yu Mincho",serif`;
  for (const [mt, label] of marks) {
    const mx = bx + bw * (mt / DUR);
    const active = t >= mt;
    ctx.fillStyle = active ? 'rgba(200,225,255,0.9)' : 'rgba(140,165,210,0.35)';
    ctx.beginPath(); ctx.arc(mx, by, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillText(label, mx, by - 8);
  }

  // ----- 終幕 -----
  if (finished) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e8f0ff';
    ctx.textAlign = 'center';
    ctx.font = `${Math.max(24, H * 0.05)}px "Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillText('旅 は 、つ づ く', W / 2, H * 0.40);
    ctx.font = `${Math.max(12, H * 0.018)}px "Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillStyle = 'rgba(200,215,245,0.75)';
    ctx.fillText('ボイジャーを超えて — 人類の最遠記録を更新', W / 2, H * 0.455);
  } else if (paused) {
    ctx.fillStyle = 'rgba(220,235,255,0.85)';
    ctx.textAlign = 'center';
    ctx.font = `${Math.max(13, H * 0.02)}px "Hiragino Mincho ProN","Yu Mincho",serif`;
    ctx.fillText('⏸ 一時停止', W / 2, H * 0.1);
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
